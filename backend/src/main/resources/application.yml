server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: property-rental-marketplace
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/property_rental_marketplace?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 32MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-development-secret-key-change-before-prod-123456}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}
    remember-me-days: ${APP_JWT_REMEMBER_ME_DAYS:14}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  upload-dir: ${APP_UPLOAD_DIR:uploads}
